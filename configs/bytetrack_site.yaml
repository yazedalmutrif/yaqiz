# ByteTrack settings for site footage (copy of Ultralytics' bytetrack.yaml with a longer buffer).
# Workers are often hidden for a moment behind rebar, columns or parapets; keeping lost
# tracks alive longer (track_buffer) reduces ID switches. Tune per camera in Sprint 1.
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 60
match_thresh: 0.8
fuse_score: True
